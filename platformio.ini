; Impostazioni condivise per tutti i firmware ESP32
[env]
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; ---------------------------------------------------------
; 1. Environment per Firmware ESP32-S3 (Universal 8MB DIO)
; ---------------------------------------------------------
[env:esp32-s3-standard]
platform = https://github.com/pioarduino/platform-espressif32.git#51.03.04
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/embed_web.py
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
test_build_src = true
; LcdDisplay pulls in lvgl/LovyanGFX and only makes sense on the Elecrow
; board below -- explicitly excluded here so PlatformIO's dependency
; scanner never tries to build it (and pull those libs in) for this target.
lib_ignore =
    LcdDisplay
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

; ---------------------------------------------------------
; 2. Environment per Firmware su Elecrow CrowPanel Advance 2.4"
;    Same firmware, PLUS the on-board LCD dashboard, running on the
;    display's own native USB-OTG host port (GPIO19/20) instead of a
;    separate Wi-Fi-connected display board.
; ---------------------------------------------------------
[env:elecrow-2-4-onboard]
platform = https://github.com/pioarduino/platform-espressif32.git#51.03.04
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/embed_web.py
test_build_src = true

; Elecrow CrowPanel Advance 2.4" (DIS01624A): ESP32-S3-WROOM-1-N16R8,
; 16MB quad flash, 8MB octal PSRAM. Matches Elecrow's documented Arduino
; IDE settings (Flash Size 16MB, PSRAM: OPI PSRAM, Partition: Huge APP) --
; except we reuse esp32-nut's own partitions.csv (OTA-capable, and an
; 8MB-sized table fits fine on this 16MB chip with room to spare).
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_LCD
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE

lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0
    lvgl/lvgl@^8.3.11
    lovyan03/LovyanGFX@^1.1.16

; ---------------------------------------------------------
; 3. Environment per i Test (Native)
; ---------------------------------------------------------
[env:native]
platform = native
platform_packages =
    toolchain-gccmingw32
test_framework = unity
test_build_src = true
lib_ignore =
    USBHostUPS
    DiagnosticLED
    NUTServer
    LcdDisplay
test_ignore = test_diagnostic_led, test_network_manager, test_ota_handler, test_system_state, test_usb_host, integration, test_config_manager
build_src_filter =
    -<*>
    +<../lib/USBHostUPS/src/HIDParser.cpp>
    +<../lib/USBHostUPS/src/APCDriver.cpp>
    +<../lib/USBHostUPS/src/CyberPowerDriver.cpp>
    +<../lib/USBHostUPS/src/OpenUPSDriver.cpp>
    +<../lib/USBHostUPS/src/EatonDriver.cpp>
    +<../lib/USBHostUPS/src/GenericDriver.cpp>
    +<../lib/USBHostUPS/src/PowercomDriver.cpp>